<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Header</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/header.css" />
  </head>

  <body>
    <header>
      <div class="nav-wrap navbar navbar-expand-md">
        <a href="#" class="brand">
          <img src="../images/logo/fr/logo.svg" alt="Logo 07zr" class="logo" />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <img src="../images/open-menu-icon.svg" class="icon-open" />
          <img src="../images/close-menu-icon.svg" class="icon-close" />
        </button>
        <nav
          class="main-nav collapse navbar-collapse"
          aria-label="Primary"
          id="navbarSupportedContent"
        >
          <a href="#">Pneus</a>
          <a href="#">Jantes</a>
          <a href="#">Chaines</a>
          <a href="#">Pièces</a>
          <a href="#">Réemploi</a>
          <a href="#">Fluides</a>
          <a href="#">Matériels</a>
          <a href="#">Batteries</a>
          <div class="nav-item has-caret" id="o7zr">
            <button class="submenu-toggle d-md-none" type="button">
              07ZR <img src="../images/chevron-menu-right.svg" />
            </button>
            <span class="d-none d-md-inline">07ZR</span>
            <ul class="submenu" aria-hidden="true">
              <li class="back-btn d-md-none">
                <button type="button">
                  <img src="../images/arrow-menu-left.svg" />
                  <span class="text-center">07ZR</span>
                </button>
              </li>

              <li><a href="#">Notre histoire</a></li>
              <li><a href="#">Nos offres</a></li>
              <li><a href="#">Espace fournisseurs</a></li>
              <li><a href="#">Espace Presse</a></li>
              <li><a href="#">FAQ</a></li>
              <li><a href="#">Contactez-Nous</a></li>
              <li><a href="#">Blog</a></li>
            </ul>
          </div>
          <div class="auth">
            <a class="btn btn-red" href="#">S'inscrire</a>
            <a class="btn btn-blue" href="#">Se connecter</a>
          </div>
        </nav>
      </div>
    </header>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
      $(function () {
        var $nav = $('.main-nav')
        var $o7zr = $('#o7zr')
        var $toggle = $o7zr.find('.submenu-toggle')
        var $submenu = $o7zr.find('.submenu')
        var $backBtn = $o7zr.find('.back-btn button')
        var $collapse = $('#navbarSupportedContent')

        function isMobile() {
          return window.matchMedia('(max-width: 767px)').matches
        }

        $toggle.on('click', function (e) {
          if (!isMobile()) return
          e.preventDefault()
          $submenu.addClass('active').attr('aria-hidden', 'false')
          $nav.addClass('submenu-open')
          $toggle.attr('aria-expanded', 'true')
          $nav.children().not($o7zr).hide()
        })

        $backBtn.on('click', function (e) {
          if (!isMobile()) return
          e.preventDefault()
          $submenu.removeClass('active').attr('aria-hidden', 'true')
          $nav.removeClass('submenu-open')
          $toggle.attr('aria-expanded', 'false')
          $nav.children().show()
        })

        $collapse.on('hidden.bs.collapse', function () {
          $submenu.removeClass('active').attr('aria-hidden', 'true')
          $nav.removeClass('submenu-open')
          $toggle.attr('aria-expanded', 'false')
          $nav.children().show()
        })
      })
    </script>
  </body>
</html>
